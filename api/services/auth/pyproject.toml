[project]
name = "service-auth"
version = "0.3.0"
description = "Auth API Endpoints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "shared[identity]",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auth"
