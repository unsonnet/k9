[project]
name = "service-auth"
version = "0.3.0"
description = "Auth API Endpoints"
requires-python = ">=3.12"
dependencies = [
    "provider[identity]",
    "pydantic>=2.12.5",
    "resolver[http]",
    "shared",
    "types",
]

[tool.uv.sources]
provider = { workspace = true }
resolver = { workspace = true }
shared = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.services"
namespace = true
