[project]
name = "services-company"
version = "1.0.2"
description = "Company API endpoints"
requires-python = ">=3.12"
dependencies = [
    "providers[database,location,storage]",
    "pydantic>=2.12.5",
    "resolvers[http]",
    "types[company]",
]

[tool.uv.sources]
providers = { workspace = true }
resolvers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.services"
namespace = true
