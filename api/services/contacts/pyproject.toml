[project]
name = "service-contacts"
version = "0.1.0"
description = "Contact API Endpoints"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "provider[database,search,storage]",
    "pydantic>=2.12.5",
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "resolver[http]",
    "shared",
    "types",
]

[tool.uv.sources]
provider = { workspace = true }
resolver = { workspace = true }
shared = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.services"
namespace = true
