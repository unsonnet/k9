[project]
name = "providers-database"
version = "1.0.0"
description = "DynamoDB database provider"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.85",
    "providers",
    "pydantic>=2.12.5",
    "types",
    "types-boto3[dynamodb]>=1.42.85",
]

[tool.uv.sources]
providers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.providers"
namespace = true
