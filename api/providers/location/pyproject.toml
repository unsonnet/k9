[project]
name = "providers-location"
version = "1.0.0"
description = "Places/location provider"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.85",
    "providers",
    "types",
    "types-boto3[geo-places]>=1.42.85",
]

[tool.uv.sources]
providers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.providers"
namespace = true
