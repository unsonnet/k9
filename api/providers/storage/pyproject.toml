[project]
name = "providers-storage"
version = "1.0.1"
description = "S3 storage provider"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
    "providers",
    "types",
    "types-boto3[s3]>=1.42.85",
]

[tool.uv.sources]
providers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.providers"
namespace = true
