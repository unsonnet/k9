[project]
name = "shared-provider-search"
version = "0.1.0"
description = "OpenSearch provider for K9 API"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.85",
    "opensearch-py>=3.2.0",
    "pydantic>=2.12.5",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared.providers"
namespace = true
