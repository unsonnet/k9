[project]
name = "providers-search"
version = "1.0.2"
description = "OpenSearch provider"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.85",
    "opensearch-py>=3.2.0",
    "providers",
    "types",
]

[tool.uv.sources]
providers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.providers"
namespace = true
