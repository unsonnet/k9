[project]
name = "types-contact"
version = "1.1.1"
description = "Contact types"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "pydantic>=2.12.5",
    "pydantic-extra-types[phonenumbers]>=2.11.1",
    "types",
]

[tool.uv.sources]
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.types"
namespace = true
