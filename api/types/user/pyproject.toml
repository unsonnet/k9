[project]
name = "types-user"
version = "1.1.0"
description = "User types"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "types",
]

[tool.uv.sources]
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.types"
namespace = true
