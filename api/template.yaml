AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: K9 API — Serverless

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    CodeUri: src/
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        PRODUCTS_TABLE: !Ref ProductsTable
        USERS_TABLE: !Ref UsersTable
        REPORTS_TABLE: !Ref ReportsTable
        IMAGES_BUCKET: !Ref ImagesBucket
        OPENSEARCH_INDEX: products
        JWT_ISSUER: k9-api
        JWT_AUDIENCE: k9-clients
        ACCESS_TOKEN_TTL: 900
        REFRESH_TOKEN_TTL: 1209600

Parameters:
  OpenSearchEndpoint:
    Type: String
    Default: ""
  UseArnLayers:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  CoreLayerArn:
    Type: String
    Default: ""
  DataLayerArn:
    Type: String
    Default: ""
  MLLayerArn:
    Type: String
    Default: ""

Conditions:
  UseArnLayersCond: !Equals [!Ref UseArnLayers, "true"]

Resources:
  ########################################
  # LAMBDA FUNCTIONS
  ########################################

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/auth.lambda_handler
      Layers:
        - !If [UseArnLayersCond, !Ref CoreLayerArn, !Ref CoreLayer]
        - !If [UseArnLayersCond, !Ref DataLayerArn, !Ref DataLayer]
        - !If [UseArnLayersCond, !Ref MLLayerArn, !Ref MLLayer]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /auth/{proxy+}
            Method: ANY
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/user.lambda_handler
      Layers:
        - !If [UseArnLayersCond, !Ref CoreLayerArn, !Ref CoreLayer]
        - !If [UseArnLayersCond, !Ref DataLayerArn, !Ref DataLayer]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /user/{proxy+}
            Method: ANY
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/product.lambda_handler
      Layers:
        - !If [UseArnLayersCond, !Ref CoreLayerArn, !Ref CoreLayer]
        - !If [UseArnLayersCond, !Ref DataLayerArn, !Ref DataLayer]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - S3CrudPolicy: { BucketName: !Ref ImagesBucket }
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /product/{proxy+}
            Method: ANY
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/report.lambda_handler
      Layers:
        - !If [UseArnLayersCond, !Ref CoreLayerArn, !Ref CoreLayer]
        - !If [UseArnLayersCond, !Ref DataLayerArn, !Ref DataLayer]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ReportsTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /report/{proxy+}
            Method: ANY
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/search.lambda_handler
      Layers:
        - !If [UseArnLayersCond, !Ref CoreLayerArn, !Ref CoreLayer]
        - !If [UseArnLayersCond, !Ref DataLayerArn, !Ref DataLayer]
        - !If [UseArnLayersCond, !Ref MLLayerArn, !Ref MLLayer]
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ProductsTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /search/{proxy+}
            Method: ANY
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint

  ########################################
  # DATA RESOURCES
  ########################################

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: author, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: author-index
          KeySchema:
            - { AttributeName: author, KeyType: HASH }
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ImagesBucket:
    Type: AWS::S3::Bucket

  ########################################
  # LAYERS
  ########################################

  CoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: k9-core
      ContentUri: layers/core/
      CompatibleRuntimes: [python3.11]

  DataLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: k9-data
      ContentUri: layers/data/
      CompatibleRuntimes: [python3.11]

  MLLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: k9-ml
      ContentUri: layers/ml/
      CompatibleRuntimes: [python3.11]

########################################
# OUTPUTS
########################################

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
  UserFunctionArn:
    Value: !GetAtt UserFunction.Arn
  ProductFunctionArn:
    Value: !GetAtt ProductFunction.Arn
  ReportFunctionArn:
    Value: !GetAtt ReportFunction.Arn
  SearchFunctionArn:
    Value: !GetAtt SearchFunction.Arn

  CoreLayerVersion:
    Condition: !Not [UseArnLayersCond]
    Value: !Ref CoreLayer

  DataLayerVersion:
    Condition: !Not [UseArnLayersCond]
    Value: !Ref DataLayer

  MLLayerVersion:
    Condition: !Not [UseArnLayersCond]
    Value: !Ref MLLayer
