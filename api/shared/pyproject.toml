[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities and types for K9 API"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
    "requests-aws4auth>=1.3.2",
    "types-boto3[cognito-idp,ssm]>=1.42.85",
]

[project.optional-dependencies]
database = ["shared-provider-database"]
identity = ["shared-provider-identity"]
location = ["shared-provider-location"]
search = ["shared-provider-search"]
storage = ["shared-provider-storage"]

[tool.uv.sources]
shared-provider-database = { workspace = true }
shared-provider-identity = { workspace = true }
shared-provider-location = { workspace = true }
shared-provider-search = { workspace = true }
shared-provider-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
namespace = true
