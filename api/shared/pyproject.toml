[project]
name = "shared"
version = "0.3.0"
description = "Shared utilities for K9 API"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "requests-aws4auth>=1.3.2",
    "types-boto3[ssm]>=1.42.85",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.shared"
namespace = true
