[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities and types for K9 API"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
    "types-boto3[ssm]>=1.42.85",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
