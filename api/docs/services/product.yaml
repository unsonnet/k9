openapi: 3.1.0
info:
  title: Product API
  version: 1.0.0
  description: |
    API for creating, retrieving, updating, and deleting products, formats, vendors, and images.

servers:
  - url: /api

security:
  - bearerAuth: []

paths:
  /product:
    post:
      summary: Create product
      description: Create a new product.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name:
                  $ref: '#/components/schemas/Name'
                category:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Created — product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Bad request — invalid request payload }
        '401': { description: Unauthorized — missing or invalid Authorization header }
        '403': { description: Forbidden — insufficient permissions }
        '500': { description: Internal server error }

  /product/{pid}:
    get:
      summary: Retrieve product
      description: Retrieve product by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK — product retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product does not exist }
        '500': { description: Internal server error }

    patch:
      summary: Update product
      description: Update product fields. Only provided fields are changed.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/NamePartial'
                category:
                  type: object
                  additionalProperties:
                    type: [string, 'null']
      responses:
        '200':
          description: OK — product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Product not found }
        '500': { description: Internal server error }

    delete:
      summary: Delete product
      description: Delete product and associated data. Operation is irreversible.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No content — product deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '500': { description: Internal server error }

  /product/{pid}/format:
    post:
      summary: Create format
      description: Create product format.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aspect]
              properties:
                aspect: { type: string }
                length: { $ref: '#/components/schemas/Dimension' }
                width: { $ref: '#/components/schemas/Dimension' }
                thickness: { $ref: '#/components/schemas/Dimension' }
      responses:
        '201':
          description: Created — format created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '400': { description: Invalid payload or aspect mismatch }
        '401': { description: Unauthorized }
        '404': { description: Product not found }
        '500': { description: Internal server error }

  /product/{pid}/format/{fid}:
    patch:
      summary: Update format
      description: Update product format. Dimensions are replaced, not merged.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aspect: { type: string }
                length: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
                width: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
                thickness: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
      responses:
        '200':
          description: OK — format updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '400': { description: Invalid request payload or aspect mismatch }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product or format does not exist }
        '500': { description: Internal server error }

    delete:
      summary: Delete format
      description: Delete product format. Operation is irreversible.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content — format deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product or format does not exist }
        '500': { description: Internal server error }

  /product/{pid}/format/{fid}/vendor:
    post:
      summary: Create vendor
      description: Create product format vendor listing.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: Created — vendor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '404': { description: Not found — product or format does not exist }
        '500': { description: Internal server error }

  /product/{pid}/format/{fid}/vendor/{vid}:
    patch:
      summary: Update vendor
      description: Update vendor listing. Currency is replaced, not merged.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorPartial'
      responses:
        '200':
          description: OK — vendor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product, format, or vendor does not exist }
        '500': { description: Internal server error }

    delete:
      summary: Delete vendor
      description: Delete product format vendor listing. Operation is irreversible.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content — vendor deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product, format, or vendor does not exist }
        '500': { description: Internal server error }

  /product/{pid}/image:
    post:
      summary: Upload image
      description: Upload product image with mask and homography for normalization.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, mask, hom]
              properties:
                image: { type: string, format: binary }
                mask: { type: string }
                hom: { type: string }
      responses:
        '201':
          description: Created — image created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400': { description: Invalid image data or homography }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Product not found }
        '500': { description: Internal server error }

  /product/{pid}/image/{iid}:
    patch:
      summary: Update image
      description: Update image metadata (mask, homography matrix).
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mask: { type: string }
                hom: { type: string }
      responses:
        '200':
          description: OK — image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400': { description: Invalid request payload or image metadata }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product or image does not exist }
        '500': { description: Internal server error }

    delete:
      summary: Delete image
      description: Delete product image. Operation is irreversible.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content — image deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — product or image does not exist }
        '500': { description: Internal server error }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      required: [id, name, category, formats, images]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/Name' }
        category:
          type: object
          additionalProperties:
            type: string
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
        images:
          type: array
          items: { $ref: '#/components/schemas/Image' }

    Name:
      type: object
      properties:
        brand: { type: string }
        series: { type: string }
        model: { type: string }

    NamePartial:
      type: object
      properties:
        brand: { type: [string, 'null'] }
        series: { type: [string, 'null'] }
        model: { type: [string, 'null'] }

    Format:
      type: object
      required: [id, aspect]
      properties:
        id: { type: string, format: uuid }
        aspect: { type: string }
        length: { $ref: '#/components/schemas/Dimension' }
        width: { $ref: '#/components/schemas/Dimension' }
        thickness: { $ref: '#/components/schemas/Dimension' }
        vendors:
          type: array
          items: { $ref: '#/components/schemas/Vendor' }

    Dimension:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer }
        unit: { type: string }

    Vendor:
      type: object
      required: [id, sku, store, name]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Currency' }
        discontinued: { type: boolean }
        url: { type: string, format: uri }

    VendorCreate:
      type: object
      required: [sku, store, name]
      properties:
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Currency' }
        discontinued: { type: boolean }
        url: { type: string }

    VendorPartial:
      type: object
      properties:
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price:
          oneOf:
            - $ref: '#/components/schemas/Currency'
            - type: 'null'
        discontinued: { type: [boolean, 'null'] }
        url: { type: [string, 'null'] }

    Currency:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer }
        unit: { type: string }

    Image:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
