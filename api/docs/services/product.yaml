openapi: 3.1.0
info:
  title: Product API
  version: 1.0.2
  description: >
    Product management API including creation, retrieval, updates, and deletion 
    of products, formats, vendors, and images.

servers:
  - url: /api

security:
  - bearerAuth: []

paths:
  /product:
    post:
      summary: Create product
      description: >
        Create a new product entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name:
                  $ref: '#/components/schemas/Name'
                category:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Created — product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Invalid request payload. }
        '401': { description: Unauthorized. }
        '409': { description: Conflict — product already exists. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}:
    parameters:
      - name: pid
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      summary: Retrieve product
      description: >
        Retrieve full product details by product ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK — product retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { description: Unauthorized. }
        '404': { description: Not found — product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

    patch:
      summary: Update product
      description: >
        Update product fields. Only provided fields are updated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/NamePartial'
                category:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: OK — product updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Invalid request payload. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

    delete:
      summary: Delete product
      description: >
        Permanently delete a product and associated data. Operation is irreversible.
        Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        '204': { description: No content — product deleted. }
        '400': { description: Invalid request parameters. }
        '401': { description: Unauthorized. }
        '403': { description: Forbidden — insufficient permissions. }
        '404': { description: Not found — product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/format:
    post:
      summary: Create format
      description: >
        Create a new product format.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aspect]
              properties:
                aspect: { type: string }
                length: { $ref: '#/components/schemas/Dimension' }
                width: { $ref: '#/components/schemas/Dimension' }
                thickness: { $ref: '#/components/schemas/Dimension' }
      responses:
        '201':
          description: Created — format created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '400': { description: Invalid request payload or aspect mismatch. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — product does not exist. }
        '409': { description: Conflict — format already exists. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/format/{fid}:
    parameters:
      - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }

    patch:
      summary: Update format
      description: >
        Update product format fields. All provided dimensions are replaced.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aspect: { type: string }
                length: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
                width: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
                thickness: { oneOf: [{ $ref: '#/components/schemas/Dimension' }, { type: 'null' }] }
      responses:
        '200':
          description: OK — format updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '400': { description: Invalid request payload or aspect mismatch. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — format or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

    delete:
      summary: Delete format
      description: >
        Permanently delete a product format. Operation is irreversible.
        Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No content — format deleted.
        '401': { description: Unauthorized. }
        '403': { description: Forbidden — insufficient permissions. }
        '404': { description: Not found — format or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/format/{fid}/vendor:
    post:
      summary: Create vendor listing
      description: >
        Create vendor listing for a product format.
      security:
        - bearerAuth: []
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreate'
      responses:
        '201':
          description: Created — vendor created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400': { description: Invalid request payload. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — product or format does not exist. }
        '409': { description: Conflict — vendor already exists. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/format/{fid}/vendor/{vid}:
    parameters:
      - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: fid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }

    patch:
      summary: Update vendor listing
      description: >
        Update vendor listing. Currency data is fully replaced when provided.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorPartial'
      responses:
        '200':
          description: OK — vendor updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
        '400': { description: Invalid request payload. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — vendor, format, or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

    delete:
      summary: Delete vendor listing
      description: >
        Permanently delete a vendor listing. Operation is irreversible.
        Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        '204': { description: No content — vendor deleted. }
        '401': { description: Unauthorized. }
        '403': { description: Forbidden — insufficient permissions. }
        '404': { description: Not found — vendor, format, or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/image:
    post:
      summary: Upload image
      description: >
        Upload product image with segmentation mask and homography data.
      security:
        - bearerAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                mask: { type: string, format: binary }
                hom: { type: string, format: binary }
      responses:
        '201':
          description: Created — image uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400': { description: Invalid image data or metadata. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

  /product/{pid}/image/{iid}:
    parameters:
      - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }

    patch:
      summary: Update image metadata
      description: >
        Update image metadata including mask or homography.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                reset: { type: boolean }
                mask: { type: string, format: binary }
                hom: { type: string, format: binary }
      responses:
        '200':
          description: OK — image metadata updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
        '400': { description: Invalid request payload. }
        '401': { description: Unauthorized. }
        '404': { description: Not found — image or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

    delete:
      summary: Delete image
      description: >
        Permanently delete product image. Operation is irreversible.
        Requires administrative privileges.
      security:
        - bearerAuth: []
      responses:
        '204': { description: No content — image deleted. }
        '401': { description: Unauthorized. }
        '403': { description: Forbidden — insufficient permissions. }
        '404': { description: Not found — image or product does not exist. }
        '429': { description: Too many requests — rate limit exceeded. }
        '500': { description: Internal server error. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      required: [id, name, category, formats, images]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/Name' }
        category:
          type: object
          additionalProperties:
            type: string
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
        images:
          type: array
          items: { $ref: '#/components/schemas/Image' }

    Name:
      type: object
      properties:
        brand: { type: string }
        series: { type: string }
        model: { type: string }

    NamePartial:
      type: object
      properties:
        brand: { type: [string, 'null'] }
        series: { type: [string, 'null'] }
        model: { type: [string, 'null'] }

    Format:
      type: object
      required: [id, aspect]
      properties:
        id: { type: string, format: uuid }
        aspect: { type: string }
        length: { $ref: '#/components/schemas/Dimension' }
        width: { $ref: '#/components/schemas/Dimension' }
        thickness: { $ref: '#/components/schemas/Dimension' }
        vendors:
          type: array
          items: { $ref: '#/components/schemas/Vendor' }

    Dimension:
      type: object
      required: [value, unit]
      properties:
        value: { type: number }
        unit: { type: string }

    Vendor:
      type: object
      required: [id, sku, store, name]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Currency' }
        discontinued: { type: boolean }
        url: { type: string, format: uri }

    VendorCreate:
      type: object
      required: [sku, store, name]
      properties:
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Currency' }
        discontinued: { type: boolean }
        url: { type: string, format: uri }

    VendorPartial:
      type: object
      properties:
        sku: { type: string }
        store: { type: string }
        name: { type: string }
        price:
          oneOf:
            - $ref: '#/components/schemas/Currency'
            - type: 'null'
        discontinued: { type: [boolean, 'null'] }
        url: { type: [string, 'null'], format: uri }

    Currency:
      type: object
      required: [value, unit]
      properties:
        value: { type: number }
        unit: { type: string }

    Image:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
