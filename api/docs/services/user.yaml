openapi: 3.1.0
info:
  title: User API
  version: 1.0.0
  description: API for managing users, including creation, retrieval, updates, deletion, and password management.

servers:
  - url: /api

paths:
  /user:
    get:
      summary: List users
      description: List users (paginated). Only for administrator role.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: nextToken
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK — users listed
          content:
            application/json:
              schema:
                type: object
                required: [total, users]
                properties:
                  total: { type: integer }
                  nextToken: { type: string }
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Internal server error }

    post:
      summary: Create user
      description: Create a new user. Only for administrator role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string }
                role: { type: string }
                preferences:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Created — user created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '409': { description: Conflict — user already exists }
        '500': { description: Internal server error }

  /user/{uid}:
    get:
      summary: Retrieve user
      description: Retrieve user by ID.
      security:
        - bearerAuth: []
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK — user retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — user does not exist }
        '500': { description: Internal server error }

    patch:
      summary: Update user
      description: Update user details. Only provided fields are changed.
      security:
        - bearerAuth: []
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                role: { type: string }
                preferences:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: 'null'
      responses:
        '200':
          description: OK — user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — user does not exist }
        '409': { description: Conflict — username or email already in use }
        '500': { description: Internal server error }

    delete:
      summary: Delete user
      description: Delete a user account. Only for administrator role.
      security:
        - bearerAuth: []
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content — user deleted }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found — user does not exist }
        '500': { description: Internal server error }

  /user/{uid}/password:
    patch:
      summary: Update password
      description: Update user password.
      security:
        - bearerAuth: []
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: No content — password updated }
        '400': { description: Invalid request payload }
        '401': { description: Unauthorized }
        '403': { description: Forbidden — insufficient permissions or incorrect password }
        '404': { description: Not found — user does not exist }
        '500': { description: Internal server error }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Profile:
      type: object
      required: [id, username, role, preferences]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string }
        preferences:
          type: object
          additionalProperties: { type: string }
