[project]
name = "k9"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "auth",
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "shared",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "services/*",
    "infra/cdk",
]

[tool.uv.sources]
shared = { workspace = true }
auth = { workspace = true }

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.250.0",
    "constructs>=10.6.0",
    "moto>=5.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-ra --strict-markers"
markers = [
    "unit: provider and service contract tests with isolated dependencies",
    "integration: handler and service contract tests with dummy providers",
]
norecursedirs = [
    ".ignore",
    ".venv",
    ".aws-sam",
    "infra/cdk/cdk.out",
]
