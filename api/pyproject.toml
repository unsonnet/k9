[project]
name = "k9"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "infra/cdk",
    "providers/*",
    "resolvers/*",
    "services/*",
    "types/*",
    "workers/*",
]

[tool.uv.sources]
providers = { workspace = true }
providers-database = { workspace = true }
providers-identity = { workspace = true }
providers-location = { workspace = true }
providers-search = { workspace = true }
providers-storage = { workspace = true }
resolvers = { workspace = true }
resolvers-dynamodb = { workspace = true }
resolvers-http = { workspace = true }
resolvers-s3 = { workspace = true }
services-auth = { workspace = true }
services-company = { workspace = true }
services-contact = { workspace = true }
services-product = { workspace = true }
services-user = { workspace = true }
types = { workspace = true }
types-company = { workspace = true }
types-contact = { workspace = true }
types-product = { workspace = true }
types-user = { workspace = true }
workers-index-company = { workspace = true }
workers-index-product = { workspace = true }
workers-sync-company = { workspace = true }
workers-sync-product = { workspace = true }
workers-sync-user = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "moto>=5.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "ruff>=0.15.8",
]
