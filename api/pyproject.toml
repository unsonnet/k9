[project]
name = "k9"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "providers/*",
    "services/*",
    "workers/*",
    "infra/cdk",
]

[tool.uv.sources]
shared = { workspace = true }
shared-provider-database = { workspace = true }
shared-provider-identity = { workspace = true }
shared-provider-location = { workspace = true }
shared-provider-search = { workspace = true }
shared-provider-storage = { workspace = true }
service-auth = { workspace = true }
service-companies = { workspace = true }
service-products = { workspace = true }
service-users = { workspace = true }
worker-index-companies = { workspace = true }
worker-sync-companies = { workspace = true }
worker-sync-products = { workspace = true }
worker-sync-users = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "moto>=5.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "ruff>=0.15.8",
]