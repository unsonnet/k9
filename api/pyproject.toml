[project]
name = "k9"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "infra/cdk",
    "providers/*",
    "resolvers/*",
    "services/*",
    "shared",
    "workers/*",
]

[tool.uv.sources]
provider = { workspace = true }
provider-database = { workspace = true }
provider-identity = { workspace = true }
provider-location = { workspace = true }
provider-search = { workspace = true }
provider-storage = { workspace = true }
resolver = { workspace = true }
resolver-dynamodb = { workspace = true }
resolver-http = { workspace = true }
resolver-s3 = { workspace = true }
service-auth = { workspace = true }
service-companies = { workspace = true }
service-products = { workspace = true }
service-users = { workspace = true }
shared = { workspace = true }
worker-index-companies = { workspace = true }
worker-index-products = { workspace = true }
worker-sync-companies = { workspace = true }
worker-sync-products = { workspace = true }
worker-sync-users = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "moto>=5.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "ruff>=0.15.8",
]