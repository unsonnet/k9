[project]
name = "k9-api"
version = "0.1.0"
description = "K9 API Backend"
authors = [{ name = "K9 Team" }]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "boto3>=1.40.55",
    "numpy>=2.0.2",
    "opensearch-py>=3.0.0",
    "pillow>=11.3.0",
    "pydantic>=2.12.3",
    "python-jose[cryptography]>=3.5.0",
    "requests-toolbelt>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W"]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "boto3-stubs[cognito-idp,dynamodb,essential,opensearchserverless,s3]>=1.40.55",
    "isort>=6.1.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.1",
    "types-requests>=2.31.0.6",
]

