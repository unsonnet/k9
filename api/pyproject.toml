[project]
name = "k9"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "auth",
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "shared",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "services/*",
    "infra/cdk",
]

[tool.uv.sources]
shared = { workspace = true }
auth = { workspace = true }

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.250.0",
    "constructs>=10.6.0",
    "ruff>=0.15.8",
]
