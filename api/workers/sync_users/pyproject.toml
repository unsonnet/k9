[project]
name = "sync_users"
version = "0.1.0"
description = "Sync Users Worker"
requires-python = ">=3.12"
dependencies = [
    "pillow-heif>=1.8.0",
    "pillow-jxl-plugin>=1.3.8",
    "pydantic>=2.12.5",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
