[project]
name = "worker-index-companies"
version = "0.3.0"
description = "Index Companies Worker"
requires-python = ">=3.12"
dependencies = [
	"provider[search]",
	"resolver[dynamodb]",
	"shared",
]

[tool.uv.sources]
provider = { workspace = true }
resolver = { workspace = true }
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.workers"
namespace = true
