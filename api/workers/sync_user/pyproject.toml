[project]
name = "workers-sync-user"
version = "1.0.2"
description = "Sync user worker"
requires-python = ">=3.12"
dependencies = [
    "pillow-heif>=1.8.0",
    "pillow-jxl-plugin>=1.3.8",
    "providers[identity,storage]",
    "pydantic>=2.12.5",
    "resolvers[s3]",
    "types",
]

[tool.uv.sources]
providers = { workspace = true }
resolvers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.workers"
namespace = true
