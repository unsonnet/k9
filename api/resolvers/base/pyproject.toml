[project]
name = "resolver"
version = "0.1.0"
description = "Shared resolvers for K9 API"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
dynamodb = ["resolver-dynamodb"]
http = ["resolver-http"]
s3 = ["resolver-s3"]

[tool.uv.sources]
resolver-dynamodb = { workspace = true }
resolver-http = { workspace = true }
resolver-s3 = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.resolvers"
namespace = true
