[project]
name = "resolver-s3"
version = "0.1.0"
description = "S3 event resolver for K9 API"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.resolvers"
namespace = true
