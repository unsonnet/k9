[project]
name = "resolvers"
version = "1.1.1"
description = "Base resolver"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "requests-aws4auth>=1.3.2",
    "types-boto3[ssm]>=1.42.85",
]

[project.optional-dependencies]
dynamodb = ["resolvers-dynamodb"]
http = ["resolvers-http"]
s3 = ["resolvers-s3"]

[tool.uv.sources]
resolvers-dynamodb = { workspace = true }
resolvers-http = { workspace = true }
resolvers-s3 = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.resolvers"
namespace = true
