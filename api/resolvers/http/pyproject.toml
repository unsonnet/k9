[project]
name = "resolvers-http"
version = "1.0.1"
description = "HTTP endpoint resolver"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
    "resolvers",
    "types",
    "types-boto3[cognito-idp]>=1.42.85",
]

[tool.uv.sources]
resolvers = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.resolvers"
namespace = true
