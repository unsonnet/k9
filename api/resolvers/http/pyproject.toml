[project]
name = "resolver-http"
version = "0.1.0"
description = "HTTP resolver for K9 API"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.26.0",
    "boto3>=1.42.85",
    "pydantic>=2.12.5",
    "resolver",
    "shared",
    "types-boto3[cognito-idp]>=1.42.85",
    "types",
]

[tool.uv.sources]
resolver = { workspace = true }
shared = { workspace = true }
types = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "k9.resolvers"
namespace = true
